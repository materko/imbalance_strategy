# Rýchle kontroly kódu: ruff (Python), ESLint (skripty webapp) a preklad C# jadra.
# pytest tu nebeží — golden testy a parita potrebujú dáta búrz a Freqtrade (docs/RUNNING.md).
name: lint

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "tester/webapp/static/js/**"
      - "tester/webapp/eslint.config.mjs"
      - "csharp/**"
      - "tradebot/adapters/csharp/build.py"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "**.py"
      - "pyproject.toml"
      - "tester/webapp/static/js/**"
      - "tester/webapp/eslint.config.mjs"
      - "csharp/**"
      - "tradebot/adapters/csharp/build.py"
      - ".github/workflows/lint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

# Repozitár má gigabajty dát (data_archive, tester/runs, tester/archive): stiahne sa len kód —
# bez blobov, ktoré checkout nepotrebuje, a bez adresárov s dátami.
env:
  SPARSE: |
    /*
    !/data_archive/*
    !/data_live/*
    !/tester/runs/*
    !/tester/archive/*

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: ${{ env.SPARSE }}
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.3
      - run: ruff check --output-format=github .

  eslint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tester/webapp
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: ${{ env.SPARSE }}
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-package-lock --no-fund --no-audit eslint@9.39.5 @eslint/js@9.39.5 globals@15.15.0
      - run: npx eslint static/js

  csharp:
    # csc.exe z .NET Frameworku, ten istý ako u nás a v NinjaTraderi (C# 5, bez NuGet)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: ${{ env.SPARSE }}
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m tradebot.adapters.csharp.build --force
