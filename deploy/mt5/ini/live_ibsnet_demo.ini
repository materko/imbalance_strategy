; Zivy beh IBSNet bez cloveka: terminal sa spusti s ulozenym uctom (FTMO-Demo), pripne EA na graf US100.cash M1
; (preset IBSNet_live.set: telemetria zapnuta, export vypnuty, profil multicharts_mnq_3m) a bezi dalej - terminal
; sa NEZATVARA. Obchodovanie je vypnute (AllowLiveTrading=0): ide o mechanizmus (spool, control subor), nie o ordery.
; Spustenie: python -m tradebot.adapters.mt5 run deploy/mt5/ini/live_ibsnet_demo.ini --wait 5
; Ovladanie: python -m tradebot.adapters.mt5 control list | control <instancia> --mode paused|enabled|flatten [--profile X]
; Ucet: [Common] Login/Server sa neuvadza - terminal pouzije posledny prihlaseny ucet (heslo ma ulozene);
; s uctom v ini by to bolo Login=<login> Server=FTMO-Demo (Password= len pri prvom prihlaseni).
[Experts]
AllowLiveTrading=0
AllowDllImport=1
Enabled=1
[StartUp]
Symbol=US100.cash
Period=M1
Expert=TradeBot\IBSNet
ExpertParameters=IBSNet_live.set
