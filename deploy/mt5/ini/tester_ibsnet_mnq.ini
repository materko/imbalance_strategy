; Beh IBSNet v Strategy Testeri nad MNQ.TB (M3, 1-minute OHLC), po behu sa terminal vypne. Treba ucet v terminali.
; Spustenie: python -m tradebot.adapters.mt5 run deploy/mt5/ini/tester_ibsnet_mnq.ini
[Experts]
AllowLiveTrading=0
AllowDllImport=1
Enabled=1
[Tester]
Expert=TradeBot\IBSNet
ExpertParameters=IBSNet_TB.set
Symbol=MNQ.TB
Period=M3
Model=1
ExecutionMode=0
Optimization=0
FromDate=2026.03.01
ToDate=2026.09.10
ForwardMode=0
Deposit=1000000
Currency=USD
Leverage=1:100
Report=TradeBot_IBSNet
ReplaceReport=1
ShutdownTerminal=1
Visual=0
UseLocal=1
UseRemote=0
UseCloud=0
