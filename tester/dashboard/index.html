<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Výsledky testovania</title>
<script>
  // Téma sa nastaví ešte pred vykreslením, aby stránka nezablikala.
  (function () {
    var t = null;
    try { t = localStorage.getItem("dashboard-theme"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>

<style>
  :root {
    --bg: #0b0f14; --surface: #121821; --surface-2: #18202b; --border: #232d3a;
    --text: #e7edf4; --muted: #8a97a8; --accent: #3b82f6;
    --pos: #22c55e; --pos-bg: rgba(34,197,94,.16); --neg: #ef4444; --neg-bg: rgba(239,68,68,.16);
    --warn: #f59e0b; --warn-bg: rgba(245,158,11,.16); --grid: rgba(138,151,168,.14);
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4f6f9; --surface: #ffffff; --surface-2: #f0f3f7; --border: #e1e6ed;
      --text: #111827; --muted: #5f6b7a; --accent: #2563eb;
      --pos: #15803d; --pos-bg: rgba(22,163,74,.13); --neg: #dc2626; --neg-bg: rgba(220,38,38,.12);
      --warn: #b45309; --warn-bg: rgba(217,119,6,.14); --grid: rgba(95,107,122,.15);
      --shadow: 0 1px 3px rgba(16,24,40,.08);
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f4f6f9; --surface: #ffffff; --surface-2: #f0f3f7; --border: #e1e6ed;
    --text: #111827; --muted: #5f6b7a; --accent: #2563eb;
    --pos: #15803d; --pos-bg: rgba(22,163,74,.13); --neg: #dc2626; --neg-bg: rgba(220,38,38,.12);
    --warn: #b45309; --warn-bg: rgba(217,119,6,.14); --grid: rgba(95,107,122,.15);
    --shadow: 0 1px 3px rgba(16,24,40,.08);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px 48px; }
  header.top {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    border-bottom: 1px solid var(--border); margin-bottom: 20px;
  }
  header.top .wrap { display: flex; align-items: center; gap: 12px; padding-top: 12px; padding-bottom: 12px; }
  .brand { font-weight: 700; font-size: 16px; letter-spacing: .2px; white-space: nowrap; }
  .brand span { color: var(--pos); }
  .meta { flex: 1; min-width: 0; color: var(--muted); font-size: 12px; }
  .meta .note { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon-btn {
    border: 1px solid var(--border); background: var(--surface); border-radius: 8px;
    width: 36px; height: 36px; display: inline-grid; place-items: center; cursor: pointer; flex: none;
  }
  .icon-btn:hover { background: var(--surface-2); }
  .crumbs { color: var(--muted); font-size: 13px; margin: 0 0 6px; display: flex; flex-wrap: wrap; gap: 6px; }
  .crumbs a:hover { color: var(--text); }
  h1 { font-size: 22px; margin: 0 0 4px; line-height: 1.25; }
  h2 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
  .sub { color: var(--muted); margin: 0 0 18px; }
  .grid { display: grid; gap: 14px; }
  .cards { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; box-shadow: var(--shadow); min-width: 0;
  }
  a.card { display: block; transition: border-color .15s, transform .15s; }
  a.card:hover { border-color: var(--accent); }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 12px; }
  .card-title { font-size: 17px; font-weight: 650; }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .kv div span { display: block; color: var(--muted); font-size: 12px; }
  .kv div b { font-size: 18px; font-variant-numeric: tabular-nums; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
    white-space: nowrap; background: var(--surface-2); color: var(--muted);
  }
  .badge.pos { background: var(--pos-bg); color: var(--pos); }
  .badge.neg { background: var(--neg-bg); color: var(--neg); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .pos { color: var(--pos); } .neg { color: var(--neg); } .muted { color: var(--muted); }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  th:first-child, td:first-child { text-align: left; }
  td.l, th.l { text-align: left; }
  tbody tr.click { cursor: pointer; }
  tbody tr.click:hover { background: var(--surface-2); }
  th.sort { cursor: pointer; user-select: none; }
  th.sort:hover { color: var(--text); }
  .prop-ctl { display: flex; flex-wrap: wrap; gap: 10px 16px; margin: 4px 0 12px; }
  .pp-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; align-items: center; }
  .pp-chip { font: inherit; font-size: 12px; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
  .pp-chip.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .pp-firm { font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; }
  .prop-ctl [hidden] { display: none !important; }
  .prop-ctl label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .prop-ctl select, .prop-ctl input { font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; min-width: 0; }
  .steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .step { border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: baseline; }
  .step b { color: var(--muted); } .step span { font-weight: 600; }
  .step.on { color: var(--text); border-color: var(--pos); background: var(--pos-bg); } .step.on b { color: var(--pos); }
  .steps-mini { display: flex; gap: 3px; align-items: center; margin-top: 12px; }
  .steps-mini i { width: 14px; height: 6px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--border); }
  .steps-mini i.on { background: var(--pos); border-color: var(--pos); }
  .steps-mini i.fail { background: var(--neg); border-color: var(--neg); }
  .step.fail { color: var(--neg); border-color: var(--neg); background: var(--neg-bg); } .step.fail b { color: var(--neg); } .steps-mini span { margin-left: 6px; font-size: 12px; }
  .an-list { margin: 4px 0 10px; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; line-height: 1.45; }
  .posudok { font-size: 13px; line-height: 1.55; } .posudok ol { padding-left: 20px; display: grid; gap: 6px; }
  h3 { font-size: 14px; margin: 6px 0; }
  .advice ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; line-height: 1.5; }
  .tiles { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; min-width: 0; }
  .tile span { display: block; color: var(--muted); font-size: 12px; }
  .tile b { display: block; font-size: 20px; margin-top: 2px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .two { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
  @media (max-width: 860px) { .two { grid-template-columns: minmax(0, 1fr); } }
  .chart-box { position: relative; height: 300px; }
  .chart-box.sm { height: 220px; }
  .chart-box.big { height: 75vh; }
  .zoom-bar { display: flex; gap: 6px; }
  .zoom-bar .btn { font-size: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; color: var(--muted); }
  .seg button.on { background: var(--surface-2); color: var(--text); font-weight: 600; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .row h2 { margin: 0; }
  .section { margin-top: 14px; }
  /* Kalendár */
  .cal-nav { display: flex; align-items: center; gap: 8px; }
  .cal-nav b { min-width: 120px; text-align: center; }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)) minmax(0, 1.1fr); gap: 4px; }
  .cal .dow { color: var(--muted); font-size: 11px; text-align: center; padding: 2px 0; }
  .cell {
    min-height: 64px; border-radius: 8px; background: var(--surface-2); padding: 5px 6px;
    display: flex; flex-direction: column; justify-content: space-between; min-width: 0;
  }
  .cell.empty { background: transparent; }
  .cell .d { font-size: 11px; color: var(--muted); }
  .cell .v { font-size: 13px; font-weight: 650; text-align: right; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
  .cell .n { font-size: 10px; color: var(--muted); text-align: right; }
  .cell.win { background: var(--pos-bg); } .cell.win .v { color: var(--pos); }
  .cell.loss { background: var(--neg-bg); } .cell.loss .v { color: var(--neg); }
  .cell.week { background: transparent; border: 1px dashed var(--border); }
  @media (max-width: 520px) {
    .cell { min-height: 46px; padding: 3px 4px; border-radius: 6px; }
    .cell .v { font-size: 10.5px; } .cell .n { display: none; }
    .cal { gap: 3px; }
    h1 { font-size: 19px; }
    .tile b { font-size: 17px; }
    .chart-box { height: 240px; }
  }
  .pager { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 10px; color: var(--muted); }
  .btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn:not(:disabled):hover { background: var(--surface-2); }
  .params { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
  .params code {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 2px 7px; font-size: 12px; overflow-wrap: anywhere;
  }
  .oos-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  .msg { padding: 40px 0; color: var(--muted); }
  .msg code { background: var(--surface); padding: 2px 6px; border-radius: 4px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  /* Diverzifikácia */
  .topnav { display: flex; gap: 4px; flex: none; }
  .topnav a { padding: 6px 10px; border-radius: 8px; color: var(--muted); font-size: 13px; font-weight: 600; }
  .topnav a:hover { color: var(--text); background: var(--surface-2); }
  .topnav a.on { color: var(--text); background: var(--surface-2); }
  @media (max-width: 640px) { .meta { display: none; } header.top .wrap { justify-content: space-between; } }
  @media (max-width: 440px) { #nav-home { display: none; } .topnav a { padding: 6px 8px; } .brand { font-size: 15px; } header.top .wrap { gap: 8px; } }
  :root { --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767; --sum: #e7edf4; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #4a3aa7; --c8: #e34948; --sum: #111827; } }
  :root[data-theme="light"] { --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #4a3aa7; --c8: #e34948; --sum: #111827; }
  .dv-pick { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); align-items: start; }
  @media (max-width: 860px) { .dv-pick { grid-template-columns: minmax(0, 1fr); } }
  .dv-strat { border-bottom: 1px solid var(--border); }
  .dv-strat:last-child { border-bottom: 0; }
  .dv-strat summary { cursor: pointer; padding: 10px 2px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; list-style: none; }
  .dv-strat summary::-webkit-details-marker { display: none; }
  .dv-strat summary::before { content: "▸"; color: var(--muted); margin-right: 6px; }
  .dv-strat[open] summary::before { content: "▾"; }
  .dv-strat summary span:first-child { flex: 1; min-width: 0; }
  .dv-set { display: flex; align-items: center; gap: 10px; padding: 7px 2px 7px 18px; border-top: 1px dashed var(--border); flex-wrap: wrap; }
  .dv-set .lbl { flex: 1 1 200px; min-width: 0; font-size: 13px; overflow-wrap: anywhere; }
  .dv-sel { display: grid; gap: 8px; }
  .dv-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); }
  .dv-item .sw { width: 12px; height: 12px; border-radius: 3px; }
  .dv-item .lbl { font-size: 13px; min-width: 0; overflow-wrap: anywhere; }
  .dv-item .lbl small { display: block; color: var(--muted); }
  .dv-item input { width: 64px; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 4px 6px; text-align: right; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:not(:disabled):hover { background: var(--accent); filter: brightness(1.1); }
  .btn:focus-visible, .dv-item input:focus-visible, .dv-strat summary:focus-visible, .topnav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .dv-find { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .dv-find li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; font-size: 13px; line-height: 1.5; }
  .dv-find .badge { justify-self: start; }
  @media (max-width: 520px) { .dv-find li { grid-template-columns: 1fr; gap: 4px; } }
  .dv-months td { text-align: center; font-size: 12px; padding: 6px 4px; border: 2px solid var(--surface); border-radius: 6px; min-width: 50px; }
  .dv-months th { text-align: center; }
  .dv-kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; margin: 0; }
  .dv-kv dt { color: var(--muted); } .dv-kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .dv-filters { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; margin-bottom: 10px; }
  .dv-filters label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .dv-filters select { font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; }
  tr.sum td { font-weight: 650; border-top: 1px solid var(--muted); }
  .sw-i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
.lv-minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.lv-mini{border:1px solid var(--border);border-radius:10px;padding:10px 12px;min-width:0}
.lv-mini .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.chart-box.xs{height:110px;margin-top:6px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/">Trade<span>Bot</span> výsledky</a>
    <nav class="topnav" aria-label="Sekcie"><a href="#/" id="nav-home">Prehľad</a><a href="#/div" id="nav-div">Diverzifikácia</a><a href="#/live" id="nav-live">Live</a></nav>
    <div class="meta"><span id="updated"></span><span class="note" id="note"></span></div>
    <button class="icon-btn" id="theme" title="Prepnúť svetlý / tmavý režim" aria-label="Prepnúť svetlý / tmavý režim">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>
<main class="wrap" id="app"><div class="msg">Načítavam dáta…</div></main>

<script>
(function () {
  "use strict";
  var OOS_START = "2025-09-04";
  var DATA = null;
  var charts = [];
  var state = { scope: "all", calMonth: null, sortKey: "date", sortDir: -1, page: 0, settingId: null };

  // ---------- pomocné ----------
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  var nf0 = new Intl.NumberFormat("sk-SK", { maximumFractionDigits: 0 });
  var nf2 = new Intl.NumberFormat("sk-SK", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  var nf1 = new Intl.NumberFormat("sk-SK", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  function num(v, d) {
    if (v == null || !isFinite(v)) return "—";
    return d === 2 ? nf2.format(v) : d === 1 ? nf1.format(v) : nf0.format(v);
  }
  function money(v, d) {
    if (v == null || !isFinite(v)) return "—";
    return (v > 0 ? "+" : v < 0 ? "−" : "") + "$" + num(Math.abs(v), d);
  }
  function compact(v) {
    var a = Math.abs(v), s = v > 0 ? "+" : v < 0 ? "−" : "";
    if (a >= 1000) return s + nf1.format(a / 1000) + "k";
    return s + nf0.format(a);
  }
  function pfFmt(v) { return v == null || !isFinite(v) ? "—" : nf2.format(v); }
  function cls(v) { return v > 0 ? "pos" : v < 0 ? "neg" : ""; }
  function pfCls(v) { return v == null ? "" : v >= 1.3 ? "pos" : v < 1 ? "neg" : "warn"; }
  function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function statusBadge(s) {
    var t = String(s || "").toLowerCase();
    var c = t.indexOf("neprešiel") === 0 ? "neg" : t.indexOf("prešiel") === 0 ? "pos" : t.indexOf("kandidát") === 0 ? "warn" : "";
    return '<span class="badge ' + c + '">' + esc(s || "—") + "</span>";
  }
  var MONTHS = ["január", "február", "marec", "apríl", "máj", "jún", "júl", "august", "september", "október", "november", "december"];
  var MONTHS_SHORT = ["jan", "feb", "mar", "apr", "máj", "jún", "júl", "aug", "sep", "okt", "nov", "dec"];
  function fmtDate(iso) {
    var d = String(iso);
    return d.slice(8, 10).replace(/^0/, "") + ". " + d.slice(5, 7).replace(/^0/, "") + ". " + d.slice(0, 4);
  }
  function fmtDateTime(iso) { return fmtDate(iso) + " " + String(iso).slice(11, 16); }

  function destroyCharts() { charts.forEach(function (c) { c.destroy(); }); charts = []; }
  function hasChart() { return typeof window.Chart !== "undefined"; }
  function chartFallback(id) {
    var el = $(id); if (el) el.parentNode.innerHTML = '<div class="msg">Graf sa nenačítal (knižnica Chart.js nie je dostupná).</div>';
  }
  function baseOpts() {
    var muted = cssVar("--muted"), grid = cssVar("--grid");
    return {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { display: false }, tooltip: { backgroundColor: cssVar("--surface-2"), titleColor: cssVar("--text"), bodyColor: cssVar("--text"), borderColor: cssVar("--border"), borderWidth: 1 } },
      scales: {
        x: { ticks: { color: muted, maxRotation: 0, autoSkip: true, maxTicksLimit: 6 }, grid: { display: false }, border: { color: grid } },
        y: { ticks: { color: muted, maxTicksLimit: 6 }, grid: { color: grid }, border: { display: false } }
      }

        '<td class="' + c + '"><b>' + r.passed + "×</b></td><td>" + r.failed + "×</td><td>" + r.attempts + (r.open ? " (+1 beží)" : "") + "</td>" +
        "<td>" + (r.attempts ? num(100 * r.passed / r.attempts) + " %" : "—") + "</td><td>" + (r.medDays != null ? num(r.medDays) + " dní" : "—") + "</td><td>" + (r.medTrades != null ? num(r.medTrades) : "—") + "</td>" +
        '<td class="l muted" style="white-space:normal">' + (reasons || "—") + "</td></tr>";
    }).join("");
    return '<div class="table-wrap"><table><thead><tr><th class="l">Výzva</th><th>Prešlo</th><th>Spálené</th><th>Pokusov</th><th>Úspešnosť</th><th>Medián dní</th><th>Medián obchodov</th><th class="l">Prečo spálené</th></tr></thead><tbody>' + rows + "</tbody></table></div>";
  }

  // ---------- postup podľa smernice a analytika ----------
  function stepsRow(s, compact) {
    // krok, ktorý stratégia skúsila a neprešla (napr. NAS100), je červený ✗
    var st = (s.steps || []).map(function (x) {
      var fail = x[0] === "8" && s.nas100 && !s.nas100.passed;
      return [x[0], x[1], x[2], fail];
    });
    if (!st.length) return "";
    // posledný hotový krok smernice (2–3 sa ráta ako 3), smernica má 10 krokov
    var done = st.reduce(function (m, x) { return x[2] ? Math.max(m, +String(x[0]).split("–").pop()) : m; }, 0);
    var total = st.reduce(function (m, x) { return Math.max(m, +String(x[0]).split("–").pop()); }, 0);
    if (compact) return '<div class="steps-mini" title="' + esc(st.map(function (x) { return (x[2] ? "✓ " : x[3] ? "✗ " : "☐ ") + x[0] + " " + x[1]; }).join("\n")) + '">' +
      st.map(function (x) { return '<i class="' + (x[2] ? "on" : x[3] ? "fail" : "") + '"></i>'; }).join("") + '<span class="muted">hotový krok ' + done + " z " + total + "</span></div>";
    return '<div class="steps">' + st.map(function (x) {
      return '<div class="step' + (x[2] ? " on" : x[3] ? " fail" : "") + '"><b>' + (x[2] ? "✓" : x[3] ? "✗" : "☐") + "</b><span>" + esc(x[0]) + "</span>" + esc(x[1]) + (x[3] ? " — neprešiel" : "") + "</div>";
    }).join("") + "</div>";
  }
  function mdInline(t) {
    return esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  }
  function nasSection(s) {
    var n = s.nas100;
    if (!n) return "";
    var alt = n.market === "XAU/USD" ? "XAU/USD" : "NAS100", base = n.market === "XAU/USD" ? "MGC" : "MNQ";   // krok 8: iný trh podľa trhu stratégie
    var mnq = s.settings && s.settings[0] && s.settings[0].analysis ? s.settings[0].analysis.total.pf : null;
    var yrs = Object.keys(n.years || {}).map(function (k) {
      var y = n.years[k]; return '<tr><td class="l">' + esc(k) + "</td><td>" + num(y.trades) + '</td><td class="' + pfCls(y.pf) + '">' + pfFmt(y.pf) + "</td></tr>";
    }).join("");
    return '<div class="card section"><div class="row"><h2>📁 ' + alt + ' (CFD, Dukascopy) <span class="badge ' + (n.passed ? "pos" : "neg") + '">krok 8 ' + (n.passed ? "✓" : "✗") + "</span></h2>" +
      '<span class="muted">ten istý profil č. 1, ticky prepočítané, spread CFD v poplatku</span></div>' +
      '<div class="kv" style="margin-bottom:10px"><div><span>PF na ' + alt + '</span><b class="' + pfCls(n.pf) + '">' + pfFmt(n.pf) + "</b></div>" +
      "<div><span>PF na " + base + "</span><b>" + pfFmt(mnq) + "</b></div><div><span>Obchodov</span><b>" + num(n.trades) + "</b></div>" +
      "<div><span>Rokov v pluse</span><b>" + n.years_pos + " / 5</b></div></div>" +
      '<div class="table-wrap"><table><thead><tr><th class="l">Rok</th><th>Obchody</th><th>PF</th></tr></thead><tbody>' + yrs + "</tbody></table></div>" +
      '<p class="muted" style="margin:10px 0 0">' + (n.passed ? "Ide rovnakým smerom ako na " + base + " — výsledok je vlastnosť trhu, nie jedného zdroja dát." :
      "Na " + alt + " nejde rovnakým smerom (PF pod 1,1 alebo menej ako 4 roky v pluse) — výsledok na " + base + " môže byť vlastnosť dát; na CFD (FTMO) nepoužívať.") + "</p></div>";
  }

  function analyticsSection(s) {
    var a = s.analytics;
    if (!a) return '<div class="card section"><h2>📁 Analytika</h2><p class="muted" style="margin:0">Krok 7 smernice ešte nebežal.</p></div>';
    var w = (a.windows || []).map(function (r) {
      var pos = String(r.pnl).charAt(0) === "+";
      return '<tr><td class="l">' + esc(r.okno) + "</td><td>" + esc(r.obchody) + '</td><td class="' + (pos ? "pos" : "neg") + '">' + esc(r.pnl) + " %</td><td>" +
        esc(r.wr) + " %</td><td>" + esc(r.dd) + " %</td><td>" + esc(r.be) + " %</td><td>" + esc(r.seria) + "</td></tr>";
    }).join("");
    var pos = (a.posudok || "").split("\n").filter(function (l) { return l.trim(); }).map(function (l) {
      return /^\d\./.test(l.trim()) ? "<li>" + mdInline(l.trim().replace(/^\d\.\s*/, "")) + "</li>" : "<p>" + mdInline(l.trim()) + "</p>";
    }).join("").replace(/(<li>.*<\/li>)/s, "<ol>$1</ol>");
    return '<div class="card section"><div class="row"><h2>📁 Analytika <span class="badge pos">krok 7 ✓</span></h2><span class="muted">' + esc(a.date || "") +
      ' · <a href="' + esc(a.link) + '" target="_blank" rel="noopener">celý dokument</a></span></div>' +
      '<div class="kv" style="margin-bottom:12px"><div><span>Charakter</span><b>' + esc(a.character || "—") + '</b></div><div><span>Test proti náhode</span><b class="pos">' +
      (a.sigma != null ? (a.sigma > 0 ? "+" : "") + num(a.sigma, 1) + " σ" : "—") + "</b></div></div>" +
      '<div class="table-wrap"><table><thead><tr><th class="l">Rok (okno)</th><th>Obchody</th><th>Zisk</th><th>WR</th><th>Max. DD</th><th>Break-even</th><th>Séria +/−</th></tr></thead><tbody>' + w + "</tbody></table></div>" +
      '<div class="grid two" style="margin-top:12px"><div><h3>V čom je dobrá</h3><ul class="an-list">' + (a.good || []).map(function (x) { return "<li>" + mdInline(x) + "</li>"; }).join("") +
      '</ul><h3>Kde má chyby</h3><ul class="an-list">' + (a.bad || []).map(function (x) { return "<li>" + mdInline(x) + "</li>"; }).join("") + "</ul></div>" +
      '<div><h3>Monte Carlo</h3><ul class="an-list">' + (a.mc || []).map(function (x) { return "<li>" + mdInline(x) + "</li>"; }).join("") + "</ul></div></div>" +
      (pos ? '<h3 style="margin-top:12px">Posudok</h3><div class="posudok">' + pos + "</div>" : "") + "</div>";
  }

  // ---------- obrazovky ----------
  // Priečinky podľa trhu (používateľ 20. 10. 2026): všetko doterajšie je Nasdaq; GOLD, DOW a SP 500 sú pripravené.
  var MARKETS = [["NASDAQ", "Nasdaq 100 — NQ / MNQ"], ["GOLD", "Zlato — GC / MGC"], ["DOW", "Dow Jones — YM / MYM"], ["SP 500", "S&P 500 — ES / MES"]];
  function marketOf(s) { return s.market || "NASDAQ"; }
  function marketHref(m) { return "#/m/" + encodeURIComponent(m); }
  function marketCrumb(s) { var m = marketOf(s); return '<a href="' + marketHref(m) + '">' + esc(m) + "</a><span>/</span>"; }
  function viewMarkets() {
    var cards = MARKETS.map(function (mk) {
      var list = DATA.strategies.filter(function (s) { return marketOf(s) === mk[0]; });
      var ok = list.filter(function (s) { return !s.testing; }).length;
      var sets = list.reduce(function (n, s) { return n + (s.testing ? 0 : (s.settings || []).length); }, 0);
      return '<a class="card" href="' + marketHref(mk[0]) + '"><div class="card-head"><div><div class="card-title">' + esc(mk[0]) +
        '</div><div class="muted">' + esc(mk[1]) + "</div></div>" +
        (list.length ? '<span class="badge pos">' + list.length + " stratégií</span>" : '<span class="badge">pripravené</span>') + "</div>" +
        '<div class="kv"><div><span>Prešli smernicou</span><b>' + ok + "</b></div><div><span>V teste</span><b>" + (list.length - ok) +
        "</b></div><div><span>Nastavení</span><b>" + sets + "</b></div></div></a>";
    }).join("");
    return '<h1>Prehľad trhov</h1><p class="sub">Stratégie sú v priečinkoch podľa trhu. Ako by vyzerali viaceré naraz, ukáže <a class="pos" href="#/div">Diverzifikácia</a>.</p>' +
      '<div class="grid cards">' + cards + "</div>";
  }
  function viewOverview(market) {
    function card(s) {
      var sets = s.settings || [];
      var best = sets.reduce(function (m, x) { return x.is && x.is.pf != null && (m == null || x.is.pf > m) ? x.is.pf : m; }, null);
      var cand = sets.filter(isCandidate).length;
      var s1 = String(s.step1 || "").toLowerCase();
      var badge = s.testing ? '<span class="badge warn">v teste</span>'
        : '<span class="badge ' + (s1.indexOf("neprešiel") === 0 ? "neg" : s1.indexOf("prešiel") === 0 ? "pos" : "") + '">krok 1: ' + esc(s.step1 || "—") + "</span>";
      return '<a class="card" href="#/s/' + encodeURIComponent(s.key) + '">' +
        '<div class="card-head"><div><div class="card-title">' + esc(s.name) + '</div><div class="muted">' + esc(s.guideline_step || "") + "</div></div>" + badge + "</div>" +
        '<div class="kv">' +
        "<div><span>Skúšané kombinácie</span><b>" + num(s.combos) + "</b></div>" +
        "<div><span>" + (s.testing ? "Najlepší kandidáti" : "Kandidáti") + "</span><b>" + cand + ' <small class="muted">/ ' + sets.length + "</small></b></div>" +
        '<div><span>Najlepší PF (in-sample)</span><b class="' + pfCls(best) + '">' + pfFmt(best) + "</b></div>" +
        "<div><span>" + (s.testing ? "Prešlo smernicou" : "Nastavení") + "</span><b>" + (s.testing ? "0" : sets.length) + "</b></div>" +
        "</div>" + stepsRow(s, true) + "</a>";
    }
    var inM = DATA.strategies.filter(function (s) { return marketOf(s) === market; });
    var ok = inM.filter(function (s) { return !s.testing; }), test = inM.filter(function (s) { return s.testing; });
    var mk = MARKETS.filter(function (x) { return x[0] === market; })[0];
    var html = '<div class="crumbs"><a href="#/">Prehľad</a><span>/</span><span>' + esc(market) + "</span></div>" +
      "<h1>" + esc(market) + '</h1><p class="sub">' + esc(mk ? mk[1] : "") + ". Klikni na stratégiu pre zoznam jej nastavení.</p>";
    if (!inM.length) return html + '<div class="card"><p class="muted" style="margin:0">Priečinok je pripravený — zatiaľ tu nie je žiadna stratégia. ' +
      "Keď stratégia na tomto trhu prejde krokom 1 a začne sa testovať, objaví sa tu.</p></div>";
    html += '<h2 class="section">Prešli smernicou</h2><div class="grid cards">' + (ok.length ? ok.map(card).join("") : '<p class="muted">Zatiaľ žiadna.</p>') + "</div>";
    if (test.length) html += '<h2 class="section">V teste — zatiaľ neprešli</h2><p class="sub">Práve sa testujú podľa smernice. Ukázané sú 3 najlepší kandidáti; ' +
      "keď niektorý prejde odloženým rokom, stratégia sa presunie hore.</p>" + '<div class="grid cards">' + test.map(card).join("") + "</div>";
    return html;
  }


  function viewStrategy(s) {
    var rows = (s.settings || []).map(function (st) {
      var w = worstYear(st);
      return '<tr class="click" data-href="#/d/' + encodeURIComponent(st.id) + '">' +
        '<td class="l">' + esc(st.label) + "</td><td class=\"l\">" + statusBadge(st.status) + "</td>" +
        '<td class="' + pfCls(st.is && st.is.pf) + '">' + pfFmt(st.is && st.is.pf) + "</td>" +

      "<h1>" + esc(s.name) + '</h1><p class="sub">' + esc(s.guideline_step || "") + " · krok 1: " + esc(s.step1 || "—") +
      " · skúšaných kombinácií " + num(s.combos) + "</p>" +
      '<div class="card"><div class="table-wrap"><table><thead><tr><th>Nastavenie</th><th class="l">Stav</th><th>PF IS</th><th>Obch./rok</th><th>Najhorší rok PF</th><th>PF OOS</th>' +
      FIRMS.map(function (f) { return "<th>" + f.short + "</th>"; }).join("") + '</tr></thead><tbody>' +

      '<div class="card section"><h2>Postup podľa smernice</h2>' + stepsRow(s, false) + "</div>" + analyticsSection(s) + nasSection(s);
  }

    var params = Object.keys(st.params || {}).map(function (k) { return "<code>" + esc(k) + " = " + esc(JSON.stringify(st.params[k])) + "</code>"; }).join("");
    var html = '<div class="crumbs"><a href="#/">Prehľad</a><span>/</span>' + marketCrumb(strat) + '<a href="#/s/' + encodeURIComponent(strat.key) + '">' + esc(strat.name) + "</a><span>/</span><span>" + esc(st.id) + "</span></div>" +
      '<div class="row" style="margin-bottom:6px"><h1>' + esc(st.label) + "</h1>" + statusBadge(st.status) + "</div>" +

    html += '<div class="card"><div class="row"><h2>Krivka kapitálu a prepad</h2><span class="muted">kumulatívny PnL podľa dní</span></div>' +

    html += '<div class="grid two section">' +

  function analysisBlocks(st) {
    var a = st.analysis, adv = st.advice || [];
    if (!a) return "";
    var t = a.total || {}, m = a.mc || {}, html = "";
    if (adv.length) html += '<div class="card section advice"><h2>Odporúčania — ako to zapínať</h2><ul>' +
      adv.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></div>";
    function k(label, val, c, sub) { return '<div class="tile"><span>' + label + '</span><b class="' + (c || "") + '">' + val + "</b>" + (sub ? "<span>" + sub + "</span>" : "") + "</div>"; }
    html += '<div class="section"><h2>Hlavné čísla</h2><div class="grid tiles">' +
      k("Profit factor", pfFmt(t.pf), pfCls(t.pf)) +
      k("Win rate", t.winrate == null ? "—" : num(t.winrate, 1) + " %") +
      k("Obchodov", num(t.trades)) +
      k("Čistý zisk", money(t.pnl), cls(t.pnl)) +
      k("Max. prepad", "−$" + num(t.maxdd), "neg", "Monte Carlo 95 %: −$" + num(m.dd_p95)) +
      k("Max. strát po sebe", num(t.loss_streak), "neg", "Monte Carlo 95 %: " + num(m.streak_p95)) +
      k("Max. ziskov po sebe", num(t.win_streak), "pos") +
      k("Najväčší zisk", money(t.max_win), "pos") +
      k("Najväčšia strata", money(t.max_loss), "neg") +
      k("Priem. zisk / strata", money(t.avg_win) + " / " + money(t.avg_loss)) +
      k("Najlepší / najhorší deň", money(a.best_day) + " / " + money(a.worst_day)) +
      k("Max. obchodov za deň", num(a.max_trades_day)) +
      "</div></div>";
    var yr = (a.years || []).map(function (y) {
      if (y.pending) return '<tr><td class="l">' + esc(y.year) + '</td><td colspan="8" class="l muted">ešte nebežal — smernica ho púšťa len raz, keď nastavenie prejde ladením a plató</td></tr>';
      return '<tr><td class="l">' + esc(y.year) + "</td><td>" + num(y.trades) + "</td><td>" + (y.winrate == null ? "—" : num(y.winrate, 1) + " %") +
        '</td><td class="' + pfCls(y.pf) + '">' + pfFmt(y.pf) + '</td><td class="' + cls(y.pnl) + '">' + money(y.pnl) +
        '</td><td class="neg">−$' + num(y.maxdd) + "</td><td>" + num(y.loss_streak) + "</td><td>" + money(y.max_win) + "</td><td>" + money(y.max_loss) + "</td></tr>";
    }).join("");
    html += '<div class="card section"><h2>Roky jeden za druhým</h2><div class="table-wrap"><table><thead><tr><th class="l">Rok (okt – sep)</th><th>Obchody</th><th>Win rate</th><th>PF</th><th>Zisk</th><th>Max. prepad</th><th>Strát po sebe</th><th>Najv. zisk</th><th>Najv. strata</th></tr></thead><tbody>' + yr + "</tbody></table></div></div>";
    var nl = a.null || {};
    function f4(v) { return v == null ? "—" : String((+v).toFixed(4)).replace(".", ","); }
    function nrow(kind, label) {
      var r = nl[kind] || {};
      if (r.sigma == null) return '<tr><td class="l">' + label + '</td><td colspan="4" class="l muted">nedalo sa spočítať</td></tr>';
      var v = r.sigma >= 2 ? ["pos", "odlíšiteľné od náhody"] : r.sigma >= 1 ? ["warn", "náznak, nie dôkaz"] : ["neg", "ako náhoda"];
      return '<tr><td class="l">' + label + "</td><td>" + f4(r.observed) + " %</td><td>" + f4(r.mean) + " % (" + f4(r.lo) + " až " + f4(r.hi) + ")</td><td>" +
        (r.sigma > 0 ? "+" : "") + num(r.sigma, 1) + ' σ</td><td class="l"><span class="badge ' + v[0] + '">' + v[1] + "</span></td></tr>";
    }
    html += '<div class="grid two section"><div class="card"><h2>Test proti náhode</h2>' +
      '<p class="muted" style="margin:0 0 8px">Tisíce náhodných vstupov s tým istým stopom, cieľom a počtom obchodov. Merané je break-even (koľko poplatku stratégia znesie). Od 2 σ je edge skutočný.</p>' +
      '<div class="table-wrap"><table><thead><tr><th class="l">Náhoda</th><th>Stratégia</th><th>Náhoda (5–95 %)</th><th>Rozdiel</th><th class="l">Záver</th></tr></thead><tbody>' +
      nrow("session", "v tých istých hodinách") + nrow("anytime", "kedykoľvek") + "</tbody></table></div></div>" +
      '<div class="card"><h2>Monte Carlo (5000 poradí obchodov)</h2><div class="kv">' +
      "<div><span>Prepad — typický</span><b>−$" + num(m.dd_median) + "</b></div>" +
      '<div><span>Prepad — 95 % ciest</span><b class="neg">−$' + num(m.dd_p95) + "</b></div>" +
      "<div><span>Strát po sebe — typicky</span><b>" + num(m.streak_median) + "</b></div>" +
      '<div><span>Strát po sebe — 95 %</span><b class="neg">' + num(m.streak_p95) + "</b></div>" +
      "<div><span>Čakanie na nové maximum (95 %)</span><b>" + num(m.wait_p95) + " obch.</b></div>" +
      '<div><span>Pravdepodobnosť zisku</span><b class="' + (m.p_positive >= 95 ? "pos" : "warn") + '">' + num(m.p_positive, 1) + " %</b></div>" +
      "</div></div></div>";
    return html;
  }

  function oosBlock(st) {
    if (!st.oos) return '<p class="muted" style="margin:0">Toto nastavenie zatiaľ nemá výsledok na odloženom roku (od ' + fmtDate(OOS_START) + ").</p>";
    var o = st.oos, i = st.is || {};
    function tile(label, a, b, fmt, c) {
      return '<div class="tile"><span>' + label + '</span><b class="' + (c || "") + '">' + fmt(a) + '</b><span>IS: ' + fmt(b) + "</span></div>";
    }
    return '<div class="grid oos-grid">' +
      tile("Profit factor", o.pf, i.pf, pfFmt, pfCls(o.pf)) +
      tile("Obchody", o.trades, i.trades, function (v) { return num(v); }) +
      tile("Win rate", o.winrate, i.winrate, function (v) { return v == null ? "—" : num(v, 1) + " %"; }) +
      tile("Čistý PnL", o.pnl, i.pnl, function (v) { return money(v); }, cls(o.pnl)) +
      tile("Max. prepad", o.maxdd, i.maxdd, function (v) { return v == null ? "—" : "$" + num(v); }) +
      "</div>" +
      '<p class="muted" style="margin:10px 0 0">PF odloženého roka ' + pfFmt(o.pf) + " oproti in-sample " + pfFmt(i.pf) +
      (i.pf ? " (" + num(100 * o.pf / i.pf) + " % in-sample)" : "") + (st.plateau_min != null ? "; plató min " + pfFmt(st.plateau_min) : "") + ".</p>";
  }

  // ---------- vykreslenie častí detailu ----------
  function renderTiles(st) {
    var s = calcStats(scopeTrades(st, state.scope));
    function t(label, val, c) { return '<div class="tile"><span>' + label + '</span><b class="' + (c || "") + '">' + val + "</b></div>"; }
    $("tiles").innerHTML =
      t("Win rate", s.winrate == null ? "—" : num(s.winrate, 1) + " %") +
      t("Profit factor", s.pf === Infinity ? "∞" : pfFmt(s.pf), pfCls(s.pf)) +
      t("Čistý PnL", money(s.net), cls(s.net)) +
      t("Priem. zisk", money(s.avgWin), "pos") +
      t("Priem. strata", money(s.avgLoss), "neg") +
      t("Najväčší zisk", money(s.maxWin), "pos") +
      t("Najväčšia strata", money(s.maxLoss), "neg") +
      t("Najdlhšia séria strát", s.n ? num(s.streak) + " obch." : "—") +
      t("Max. prepad", s.n ? "−$" + num(s.maxdd) : "—", s.maxdd ? "neg" : "") +
      t("Obchodov za rok", num(s.perYear)) +
      t("Očakávanie / obchod", money(s.expectancy, 2), cls(s.expectancy)) +

    Array.prototype.forEach.call($("scope").querySelectorAll("button"), function (b) { b.classList.toggle("on", b.getAttribute("data-s") === state.scope); });
  }

  function dailyMap(st) {
    var m = {}, cnt = {};
    (st.daily || []).forEach(function (d) { m[d[0]] = (m[d[0]] || 0) + (+d[1]); });
    (st.trades || []).forEach(function (t) { var k = t.close.slice(0, 10); cnt[k] = (cnt[k] || 0) + 1; });
    return { pnl: m, cnt: cnt };
  }

  function renderCalendar(st, dm) {
    var ym = state.calMonth, y = +ym.slice(0, 4), mo = +ym.slice(5, 7) - 1;
    $("cal-title").textContent = MONTHS[mo] + " " + y;
    var first = new Date(Date.UTC(y, mo, 1)), days = new Date(Date.UTC(y, mo + 1, 0)).getUTCDate();
    var lead = (first.getUTCDay() + 6) % 7; // pondelok = 0
    var html = ["po", "ut", "st", "št", "pi", "so", "ne", "týždeň"].map(function (d) { return '<div class="dow">' + d + "</div>"; }).join("");
    var cells = [], i, total = 0, tradingDays = 0;
    for (i = 0; i < lead; i++) cells.push(null);
    for (i = 1; i <= days; i++) cells.push(i);
    while (cells.length % 7) cells.push(null);
    for (var w = 0; w < cells.length / 7; w++) {
      var wk = 0, wkHas = false;
      for (var c = 0; c < 7; c++) {
        var day = cells[w * 7 + c];
        if (day == null) { html += '<div class="cell empty"></div>'; continue; }
        var key = y + "-" + String(mo + 1).padStart(2, "0") + "-" + String(day).padStart(2, "0");
        var v = dm.pnl[key], n = dm.cnt[key] || 0;
        if (v == null) { html += '<div class="cell' + '"><span class="d">' + day + "</span></div>"; continue; }
        wk += v; wkHas = true; total += v; tradingDays++;
        html += '<div class="cell ' + (v > 0 ? "win" : v < 0 ? "loss" : "") + '" title="' + fmtDate(key) + ": " + esc(money(v, 2)) + '">' +
          '<span class="d">' + day + '</span><div><div class="v">' + compact(v) + '</div><div class="n">' + n + " obch.</div></div></div>";
      }
      html += '<div class="cell week"><span class="d">t' + (w + 1) + '</span><div class="v ' + (wkHas ? cls(wk) : "muted") + '">' + (wkHas ? compact(wk) : "—") + "</div></div>";
    }
    $("cal").innerHTML = html;
    $("cal-sum").innerHTML = 'Mesiac: <b class="' + cls(total) + '">' + money(total) + "</b> · obchodných dní " + tradingDays +
      (st.oos && ym >= OOS_START.slice(0, 7) ? ' · <span class="badge warn">odložený rok</span>' : "");
    var months = calMonths(st);
    $("cal-prev").disabled = ym <= months[0];
    $("cal-next").disabled = ym >= months[months.length - 1];
  }
  function calMonths(st) {
    var d = st.daily || [];
    if (!d.length) return [OOS_START.slice(0, 7)];
    return [d[0][0].slice(0, 7), d[d.length - 1][0].slice(0, 7)];
  }
  function shiftMonth(ym, k) {
    var y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1 + k;
    y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
    return y + "-" + String(m + 1).padStart(2, "0");
  }

  function renderCharts(st, dm) {
    if (!hasChart()) { ["ch-eq", "ch-month", "ch-years"].forEach(chartFallback); return; }
    var pos = cssVar("--pos"), neg = cssVar("--neg"), accent = cssVar("--accent"), warn = cssVar("--warn"), muted = cssVar("--muted");
    // equity + drawdown
    var eq = st.equity || [], labels = eq.map(function (e) { return e[0]; }), peak = 0;
    var ddv = eq.map(function (e) { if (e[1] > peak) peak = e[1]; return Math.round((e[1] - peak) * 100) / 100; });
    var vIdx = null;
    if (st.oos) for (var i = 0; i < labels.length; i++) if (labels[i] >= OOS_START) { vIdx = i; break; }
    var o = baseOpts();
    o.scales.x.ticks.callback = function (v) { var l = labels[v]; return l ? MONTHS_SHORT[+l.slice(5, 7) - 1] + " " + l.slice(2, 4) : ""; };
    o.scales.y.ticks.callback = function (v) { return compact(v); };
    o.plugins.tooltip.callbacks = { title: function (it) { return fmtDate(it[0].label); }, label: function (it) { return (it.datasetIndex ? "prepad " : "kapitál ") + money(it.raw, 2); } };
    o.plugins.guides = { vline: vIdx, vcolor: warn, hlines: [{ value: 0, color: muted, dash: [2, 3] }] };
    charts.push(new Chart($("ch-eq"), {
      type: "line", plugins: [guidePlugin],
      data: { labels: labels, datasets: [
        { data: eq.map(function (e) { return e[1]; }), borderColor: accent, borderWidth: 2, pointRadius: 0, tension: 0.15, fill: false },
        { data: ddv, borderColor: neg, borderWidth: 1, pointRadius: 0, fill: "origin", backgroundColor: cssVar("--neg-bg"), tension: 0 }
      ] },
      options: o
    }));
    // mesačné súčty
    var mm = {};
    Object.keys(dm.pnl).forEach(function (k) { var m = k.slice(0, 7); mm[m] = (mm[m] || 0) + dm.pnl[k]; });
    var mk = Object.keys(mm).sort(), mv = mk.map(function (k) { return Math.round(mm[k] * 100) / 100; });
    var o2 = baseOpts();
    o2.scales.x.ticks.callback = function (v) { var l = mk[v]; return l ? MONTHS_SHORT[+l.slice(5, 7) - 1] + " " + l.slice(2, 4) : ""; };
    o2.scales.y.ticks.callback = function (v) { return compact(v); };
    o2.plugins.tooltip.callbacks = { title: function (it) { var l = it[0].label; return MONTHS[+l.slice(5, 7) - 1] + " " + l.slice(0, 4); }, label: function (it) { return money(it.raw, 2); } };
    o2.onClick = function (e, els) { if (els.length) { state.calMonth = mk[els[0].index]; renderCalendar(st, dm); } };
    charts.push(new Chart($("ch-month"), {
      type: "bar",
      data: { labels: mk, datasets: [{ data: mv, backgroundColor: mv.map(function (v) { return v >= 0 ? pos : neg; }), borderRadius: 2, maxBarThickness: 14 }] },
      options: o2
    }));
    // PF po rokoch
    var yrs = (st.is && st.is.years) || {}, yk = Object.keys(yrs), yv = yk.map(function (k) { return yrs[k]; });
    var colors = yv.map(function (v) { return v == null ? muted : v >= 1 ? pos : neg; });
    if (st.oos) { yk.push("odlož."); yv.push(st.oos.pf); colors.push(warn); }
    var o3 = baseOpts();
    o3.scales.x.ticks.maxTicksLimit = 12;
    o3.scales.y.beginAtZero = true;
    o3.scales.y.suggestedMax = 1.6;
    o3.plugins.tooltip.callbacks = { label: function (it) { return "PF " + pfFmt(it.raw); } };
    o3.plugins.guides = { hlines: [{ value: 1, color: neg, label: "1,0" }, { value: 1.3, color: pos, label: "1,3" }] };
    charts.push(new Chart($("ch-years"), {
      type: "bar", plugins: [guidePlugin],
      data: { labels: yk, datasets: [{ data: yv, backgroundColor: colors, borderRadius: 3, maxBarThickness: 40 }] },
      options: o3
    }));
  }

  function renderTrades(st) {
    var t = (st.trades || []).slice(), k = state.sortKey, d = state.sortDir;
    t.sort(function (a, b) {
      var x = k === "pnl" ? a.pnl - b.pnl : (a.open < b.open ? -1 : a.open > b.open ? 1 : 0);
      return x * d;
    });
    var per = 50, pages = Math.max(1, Math.ceil(t.length / per));
    if (state.page >= pages) state.page = pages - 1;
    var rows = t.slice(state.page * per, state.page * per + per).map(function (x) {
      var oos = st.oos && x.close.slice(0, 10) >= OOS_START;
      return "<tr><td class=\"l\">" + fmtDateTime(x.open) + (oos ? ' <span class="badge warn">OOS</span>' : "") + '</td><td class="l">' + fmtDateTime(x.close) + "</td>" +
        '<td class="l">' + (x.dir === "short" ? '<span class="neg">short</span>' : '<span class="pos">long</span>') + "</td>" +
        "<td>" + num(x.entry, 2) + "</td><td>" + num(x.exit, 2) + '</td><td class="' + cls(x.pnl) + '">' + money(x.pnl, 2) + '</td><td class="l muted">' + esc(x.reason || "") + "</td></tr>";
    }).join("");
    $("tr-body").innerHTML = rows || '<tr><td colspan="7" class="muted">Žiadne obchody.</td></tr>';
    $("tr-count").textContent = num(t.length) + " obchodov";
    $("pg-info").textContent = "strana " + (state.page + 1) + " / " + pages;
    $("pg-prev").disabled = state.page === 0;
    $("pg-next").disabled = state.page >= pages - 1;
    Array.prototype.forEach.call(document.querySelectorAll("th.sort"), function (th) {
      var base = th.getAttribute("data-k") === "pnl" ? "PnL" : "Otvorenie";
      th.textContent = base + (th.getAttribute("data-k") === k ? (d > 0 ? " ▲" : " ▼") : " ↕");
    });
  }

  // ---------- diverzifikácia ----------
  // Viac nastavení naraz (aj z rôznych stratégií): obchody a dni sa zlúčia, každé nastavenie so svojím
  // násobkom veľkosti, a spočíta sa to isté čo pri jednom nastavení — roky, mesiace, dni, obchody, prepad.
  var DV_KEY = "dashboard-diverzifikacia";
  var DV_MAX = 8;
  var DV_COLORS = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6", "--c7", "--c8"];
  var DV_YEARS = [["21/22", "2021-10-01", "2022-10-01"], ["22/23", "2022-10-01", "2023-10-01"], ["23/24", "2023-10-01", "2024-10-01"],
                  ["24/25", "2024-10-01", OOS_START], ["25/26 (odložený)", OOS_START, "2026-09-05"]];
  var DV_WD = ["Po", "Ut", "St", "Št", "Pi", "So", "Ne"];
  var dv = { items: null, result: null, open: {}, log: { view: "tr", item: "", year: "", res: "", page: 0, sort: null, dir: 1 } };

  function dvLoad() {
    if (dv.items) return;
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(DV_KEY) || "null"); } catch (e) {}
    dv.items = (saved || []).filter(function (x) { return x && findSetting(x.id); }).slice(0, DV_MAX);
    if (!saved) {
      // prvé otvorenie: najlepšie nastavenie (č. 1) z troch stratégií, ktoré prešli smernicou, ako príklad
      DATA.strategies.filter(function (s) { return !s.testing && (s.settings || []).length; }).slice(0, 3).forEach(function (s) {
        dv.items.push({ id: s.settings[0].id, mult: 1 });
      });
    }
  }
  function dvSave() { try { localStorage.setItem(DV_KEY, JSON.stringify(dv.items)); } catch (e) {} }
  function dvColor(i) { return "var(" + DV_COLORS[i % DV_COLORS.length] + ")"; }
  function dvSw(i) { return '<span class="sw-i" style="background:' + dvColor(i) + '"></span>'; }
  function dvYear(d) { for (var i = 0; i < DV_YEARS.length; i++) if (d >= DV_YEARS[i][1] && d < DV_YEARS[i][2]) return DV_YEARS[i][0]; return ""; }
  var dvNyFmt = null;
  function dvNyHour(iso) {
    try {
      dvNyFmt = dvNyFmt || new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour: "2-digit", hour12: false });
      return +dvNyFmt.format(new Date(iso)) % 24;
    } catch (e) { return new Date(iso).getUTCHours(); }
  }
  function dvShort(f) { return String(f.st.label || f.st.id).split(" · ")[0]; }

  function dvStats(pnls) {
    var n = pnls.length, gw = 0, gl = 0, w = 0, eq = 0, peak = 0, dd = 0, cw = 0, cl = 0, ws = 0, ls = 0, best = null, worst = null;
    pnls.forEach(function (p) {
      if (p > 0) { gw += p; w++; cw++; cl = 0; } else { if (p < 0) gl -= p; cl++; cw = 0; }
      if (cw > ws) ws = cw; if (cl > ls) ls = cl;
      eq += p; if (eq > peak) peak = eq; if (peak - eq > dd) dd = peak - eq;
      if (best == null || p > best) best = p; if (worst == null || p < worst) worst = p;
    });
    return { n: n, wr: n ? 100 * w / n : null, pf: gl ? gw / gl : (gw ? Infinity : null), pnl: gw - gl, dd: dd,
             avgWin: w ? gw / w : null, avgLoss: n - w ? -gl / (n - w) : null, winStreak: ws, lossStreak: ls,
             best: best, worst: worst, retDd: dd ? (gw - gl) / dd : null };
  }

  function dvCompute() {
    var parts = dv.items.map(function (it, i) {
      var f = findSetting(it.id), m = +it.mult || 1;
      var trades = (f.st.trades || []).map(function (t) {
        return { i: i, open: t.open, close: t.close, dir: t.dir, entry: t.entry, exit: t.exit, reason: t.reason, pnl: (+t.pnl) * m };
      }).sort(function (a, b) { return a.open < b.open ? -1 : a.open > b.open ? 1 : 0; });
      var daily = {};
      (f.st.daily || []).forEach(function (d) { daily[d[0]] = (daily[d[0]] || 0) + (+d[1]) * m; });
      return { i: i, f: f, mult: m, trades: trades, daily: daily, name: dvShort(f) };
    });
    var all = [].concat.apply([], parts.map(function (p) { return p.trades; })).sort(function (a, b) { return a.close < b.close ? -1 : a.close > b.close ? 1 : 0; });
    var days = {};
    parts.forEach(function (p) { Object.keys(p.daily).forEach(function (d) { days[d] = (days[d] || 0) + p.daily[d]; }); });
    var dayKeys = Object.keys(days).sort();
    function yearly(trs) {
      return DV_YEARS.map(function (y) {
        return dvStats(trs.filter(function (t) { var d = t.open.slice(0, 10); return d >= y[1] && d < y[2]; }).map(function (t) { return t.pnl; }));
      });
    }
    function dayPart(map) {
      var keys = Object.keys(map).sort(), vals = keys.map(function (k) { return map[k]; });
      var pos = vals.filter(function (v) { return v > 0; }), neg = vals.filter(function (v) { return v < 0; });
      var ls = 0, cl = 0, months = {}, wd = {};
      keys.forEach(function (k, j) {
        var v = vals[j]; cl = v < 0 ? cl + 1 : 0; if (cl > ls) ls = cl;
        months[k.slice(0, 7)] = (months[k.slice(0, 7)] || 0) + v;
        var w = (new Date(k + "T12:00:00Z").getUTCDay() + 6) % 7;
        (wd[w] = wd[w] || []).push(v);
      });
      var mk = Object.keys(months).sort(), mv = mk.map(function (k) { return months[k]; });
      var sorted = vals.slice().sort(function (a, b) { return a - b; });
      function at(v) { return keys[vals.indexOf(v)]; }
      return {
        days: vals.length, winPct: vals.length ? 100 * pos.length / vals.length : 0,
        avg: vals.length ? vals.reduce(function (a, b) { return a + b; }, 0) / vals.length : 0,
        median: sorted.length ? (sorted.length % 2 ? sorted[(sorted.length - 1) / 2] : (sorted[sorted.length / 2 - 1] + sorted[sorted.length / 2]) / 2) : 0,
        avgWin: pos.length ? pos.reduce(function (a, b) { return a + b; }, 0) / pos.length : 0,
        avgLoss: neg.length ? neg.reduce(function (a, b) { return a + b; }, 0) / neg.length : 0,
        lossStreak: ls, months: months, monthsPos: mv.length ? 100 * mv.filter(function (v) { return v > 0; }).length / mv.length : 0,
        worstMonth: mk.length ? [mk[mv.indexOf(Math.min.apply(null, mv))], Math.min.apply(null, mv)] : null,
        bestMonth: mk.length ? [mk[mv.indexOf(Math.max.apply(null, mv))], Math.max.apply(null, mv)] : null,

        weekday: wd

    // korelácia denných výsledkov (dni, keď obchodovali obe)
    var corr = [];
    for (var a = 0; a < parts.length; a++) for (var b = a + 1; b < parts.length; b++) {

      var r = null, both = 0;
      if (common.length > 10) {
        var xa = common.map(function (d) { return ka[d]; }), xb = common.map(function (d) { return kb[d]; });
        var ma = xa.reduce(function (s, v) { return s + v; }, 0) / xa.length, mb = xb.reduce(function (s, v) { return s + v; }, 0) / xb.length;
        var cov = 0, va = 0, vb = 0;
        for (var j = 0; j < xa.length; j++) { cov += (xa[j] - ma) * (xb[j] - mb); va += (xa[j] - ma) * (xa[j] - ma); vb += (xb[j] - mb) * (xb[j] - mb); }

    var eq = 0, equity = dayKeys.map(function (d) { eq += days[d]; return [d, eq]; });
    return {
      parts: parts.map(function (p) {

    var cy = R.yearly.filter(function (y) { return y.n && y.pnl < 0; });

    if (R.corr.length) {
      var rs = R.corr.filter(function (c) { return c.r != null; });
      var hi = rs.filter(function (c) { return c.r >= 0.5; });
      var rtxt = rs.map(function (c) { return esc(P[c.a].name) + " × " + esc(P[c.b].name) + " " + num(c.r, 2); }).join(", ");
      out.push(hi.length ? ["warn", "Niektoré nastavenia sa hýbu spolu (korelácia ≥ 0,5): " + hi.map(function (c) { return esc(P[c.a].name) + " × " + esc(P[c.b].name); }).join(", ") + ". Ich súčet sa správa skôr ako väčšia pozícia než ako diverzifikácia."]

    var sumDd = P.reduce(function (s, p) { return s + p.total.dd; }, 0);

      '<div class="dv-filters"><label>Stratégia<select id="lv-f-inst"><option value="">všetky</option>' + opts + "</select></label></div>" +
      '<div class="table-wrap"><table id="lv-log"></table></div><div class="pager"><span id="lv-info"></span><button class="btn" id="lv-prev">‹</button><button class="btn" id="lv-next">›</button></div></div>' +
      (stale.length ? '<details class="card section"><summary class="muted" style="cursor:pointer">Staré a testovacie inštancie (' + stale.length + ") — bez obchodu a bez správy viac ako 7 dní</summary><div class=\"table-wrap\"><table><tbody>" +
        stale.map(function (x) { return '<tr><td class="l">' + esc(x.name) + '</td><td class="l">' + esc(lvPlat(x)) + " · " + esc(x.account) + '</td><td class="l muted">' + esc(x.profile || "—") + "</td><td>" + lvStatus(x) + "</td><td>" + lvTime(x.last_event) + "</td></tr>"; }).join("") +
        "</tbody></table></div></details>" : "");
  }
  function lvRenderLog() {
    var list = lvActive(), n = 50, rows, head;
    var pick = LV.inst === "" ? list.map(function (x, i) { return i; }) : [+LV.inst];
    function each(fn) { var out = []; pick.forEach(function (i) { var x = list[i]; if (x) fn(x, i, out); }); return out; }
    if (LV.log === "tr") {
      head = '<th class="l">Otvorenie</th><th class="l">Zatvorenie</th><th class="l">Stratégia</th><th class="l">Smer</th><th>Množ.</th><th>Vstup</th><th>Výstup</th><th>SL</th><th>TP</th><th class="l">Dôvod</th><th>R</th><th>PnL</th>';
      rows = each(function (x, i, out) { (x.trades || []).forEach(function (t) { out.push({ k: t.close, h: '<td class="l">' + lvTime(t.open) + '</td><td class="l">' + lvTime(t.close) + '</td><td class="l">' + dvSw(i) + esc(lvName(x)) + ' <small class="muted">' + esc(lvPlat(x)) + "</small></td>" +
        '<td class="l">' + t.dir + "</td><td>" + num(t.qty, t.qty % 1 ? 2 : 0) + "</td><td>" + num(t.entry, 2) + "</td><td>" + num(t.exit, 2) + "</td><td>" + num(t.sl, 2) + "</td><td>" + num(t.tp, 2) + '</td><td class="l">' + lvReason(t.reason) +
        '</td><td class="' + cls(t.r) + '">' + (t.r == null ? "—" : num(t.r, 2)) + '</td><td class="' + cls(t.pnl) + '">' + money(t.pnl, 2) + "</td>" }); }); });
    } else if (LV.log === "sig") {
      head = '<th class="l">Signál (sviečka)</th><th class="l">Stratégia</th><th class="l">Smer</th><th class="l">Typ</th><th>Vstup</th><th>SL</th><th>TP</th><th>Množ.</th><th class="l">Výsledok</th>';
      rows = each(function (x, i, out) { (x.signals || []).forEach(function (s) {
        var c = s.result === "vyplnený" ? "pos" : s.result === "bez vyplnenia" ? "neg" : s.result === "čaká" ? "warn" : "";
        out.push({ k: s.t, h: '<td class="l">' + lvTime(s.t) + '</td><td class="l">' + dvSw(i) + esc(lvName(x)) + ' <small class="muted">' + esc(lvPlat(x)) + '</small></td><td class="l">' + s.dir + '</td><td class="l">' + esc(s.type) + "</td><td>" + num(s.entry, 2) + "</td><td>" + num(s.sl, 2) + "</td><td>" + num(s.tp, 2) +
          "</td><td>" + (s.qty == null ? "—" : num(s.qty, s.qty % 1 ? 2 : 0)) + '</td><td class="l"><span class="badge ' + c + '">' + esc(s.result) + "</span></td>" }); }); });
    } else if (LV.log === "open") {
      head = '<th class="l">Otvorenie</th><th class="l">Stratégia</th><th class="l">Smer</th><th>Množ.</th><th>Vstup</th><th>SL</th><th>TP</th>';
      rows = each(function (x, i, out) { (x.open || []).forEach(function (t) { out.push({ k: t.open, h: '<td class="l">' + lvTime(t.open) + '</td><td class="l">' + dvSw(i) + esc(lvName(x)) + ' <small class="muted">' + esc(lvPlat(x)) + '</small></td><td class="l">' + t.dir + "</td><td>" + num(t.qty, t.qty % 1 ? 2 : 0) + "</td><td>" + num(t.entry, 2) + "</td><td>" + num(t.sl, 2) + "</td><td>" + num(t.tp, 2) + "</td>" }); }); });
    } else {
      head = '<th class="l">Čas</th><th class="l">Stratégia</th><th class="l">Text</th>';
      rows = each(function (x, i, out) { (x.notes || []).forEach(function (m) { out.push({ k: m.t, h: '<td class="l">' + lvTime(m.t) + '</td><td class="l">' + dvSw(i) + esc(lvName(x)) + ' <small class="muted">' + esc(lvPlat(x)) + '</small></td><td class="l" style="white-space:normal">' + esc(m.text) + "</td>" }); }); });
    }
    rows.sort(function (a, b) { return a.k < b.k ? 1 : -1; });
    var pages = Math.max(1, Math.ceil(rows.length / n));
    LV.page = Math.min(LV.page, pages - 1);
    var cols = (head.match(/<th/g) || []).length;
    $("lv-log").innerHTML = "<thead><tr>" + head + "</tr></thead><tbody>" + (rows.slice(LV.page * n, LV.page * n + n).map(function (r) { return "<tr>" + r.h + "</tr>"; }).join("") ||
      '<tr><td class="l muted" colspan="' + cols + '">Nič.</td></tr>') + "</tbody>";
    $("lv-info").textContent = rows.length + " riadkov · strana " + (LV.page + 1) + " z " + pages;
    $("lv-prev").disabled = LV.page === 0; $("lv-next").disabled = LV.page >= pages - 1;
    Array.prototype.forEach.call($("lv-view").querySelectorAll("button"), function (b) { b.className = b.getAttribute("data-v") === LV.log ? "on" : ""; });
  }
  function lvPlatforms(list) {
    var out = [];
    list.forEach(function (x) { var p = lvPlat(x); if ((x.trades || []).length && out.indexOf(p) < 0) out.push(p); });
    return out;
  }
  function lvCharts() {
    var list = lvActive(), tr = lvAllTrades(list);
    if (!tr.length || !$("lv-eq")) return;
    if (!hasChart()) { chartFallback("lv-eq"); return; }
    // prvý bod = štart najstaršej živej inštancie s obchodom, všetky krivky od nuly
    var start = list.filter(function (x) { return (x.trades || []).length; }).reduce(function (m, x) { return !m || x.since < m ? x.since : m; }, "");
    var labels = [start].concat(tr.map(function (o) { return o.t.close; })), cum = list.map(function () { return 0; }), tot = 0;
    var data = list.map(function (x) { return [(x.trades || []).length ? 0 : null]; }), sum = [0];
    tr.forEach(function (o) {
      cum[o.i] += o.t.pnl || 0; tot += o.t.pnl || 0;
      list.forEach(function (x, i) { data[i].push((x.trades || []).length ? cum[i] : null); });
      sum.push(tot);
    });
    var o = baseOpts();
    o.scales.x.ticks.callback = function (v) { return lvTime(labels[v]); };
    o.scales.y.ticks.callback = function (v) { return compact(v); };
    o.plugins.tooltip.callbacks = { title: function (it) { return lvTime(labels[it[0].dataIndex]); }, label: function (it) { return it.dataset.label + " " + money(it.raw, 0); } };
    o.plugins.guides = { hlines: [{ value: 0, color: cssVar("--muted"), dash: [2, 3] }] };
    // hore: súčet a súčet každej platformy
    var plats = lvPlatforms(list), pcum = plats.map(function () { return 0; }), pdata = plats.map(function () { return [0]; });
    tr.forEach(function (o) {
      var k = plats.indexOf(lvPlat(list[o.i])); pcum[k] += o.t.pnl || 0;
      plats.forEach(function (p, j) { pdata[j].push(pcum[j]); });
    });
    var ds = plats.map(function (p, k) { return { label: p + " spolu", data: pdata[k], borderColor: cssVar(DV_COLORS[k % 8]), borderWidth: 2, pointRadius: 0, stepped: true, fill: false }; });
    ds.push({ label: "Spolu", data: sum, borderColor: cssVar("--sum"), borderWidth: 2.5, pointRadius: 0, stepped: true, fill: false });
    charts.push(new Chart($("lv-eq"), { type: "line", plugins: [guidePlugin], data: { labels: labels, datasets: ds }, options: o }));
    // pod ním: každá stratégia vo vlastnom malom grafe (vlastná mierka)
    list.forEach(function (x, i) {
      var t = (x.trades || []).slice().sort(function (a, b) { return a.close < b.close ? -1 : 1; }), el = $("lv-mini-" + i);
      if (!t.length || !el) return;
      var c = 0, lab = [x.since], val = [0];
      t.forEach(function (q) { c += q.pnl || 0; lab.push(q.close); val.push(c); });
      var m = baseOpts();
      m.plugins.legend = { display: false };
      m.scales.x.display = false;
      m.scales.y.ticks.callback = function (v) { return compact(v); };
      m.scales.y.ticks.maxTicksLimit = 3;
      m.plugins.tooltip.callbacks = { title: function (it) { return lvTime(lab[it[0].dataIndex]); }, label: function (it) { return money(it.raw, 0); } };
      m.plugins.guides = { hlines: [{ value: 0, color: cssVar("--muted"), dash: [2, 3] }] };
      charts.push(new Chart(el, { type: "line", plugins: [guidePlugin], data: { labels: lab, datasets: [{ data: val, borderColor: cssVar(DV_COLORS[i % 8]), borderWidth: 2, pointRadius: 2, stepped: true, fill: false }] }, options: m }));
    });
  }
  function mountLive() {
    if (!DATA.live) return;
    lvCharts();
    $("lv-view").addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return; LV.log = b.getAttribute("data-v"); LV.page = 0; lvRenderLog(); });
    $("lv-f-inst").value = LV.inst;
    $("lv-f-inst").addEventListener("change", function (e) { LV.inst = e.target.value; LV.page = 0; lvRenderLog(); });
    $("lv-prev").addEventListener("click", function () { LV.page--; lvRenderLog(); });
    $("lv-next").addEventListener("click", function () { LV.page++; lvRenderLog(); });
    lvRenderLog();
  }

  // ---------- smerovanie ----------
  function route() {
    destroyCharts();
    var h = location.hash.replace(/^#\/?/, ""), parts = h.split("/").map(decodeURIComponent), app = $("app");
    window.scrollTo(0, 0);
    $("nav-home").className = parts[0] === "div" || parts[0] === "live" ? "" : "on";
    $("nav-div").className = parts[0] === "div" ? "on" : "";
    $("nav-live").className = parts[0] === "live" ? "on" : "";
    if (parts[0] === "live") {
      app.innerHTML = viewLive();
      document.title = "Live — Výsledky testovania";
      mountLive();
      return;
    }
    if (parts[0] === "div") {
      app.innerHTML = viewDiversify();
      document.title = "Diverzifikácia — Výsledky testovania";
      mountDiversify();
      return;
    }
    if (parts[0] === "m" && parts[1]) {
      app.innerHTML = viewOverview(parts[1]);
      document.title = parts[1] + " — Výsledky testovania";
      return;
    }
    if (parts[0] === "s" && parts[1]) {
      var s = findStrategy(parts[1]);
      app.innerHTML = s ? viewStrategy(s) : notFound();
      Array.prototype.forEach.call(app.querySelectorAll("tr[data-href]"), function (tr) {
        tr.addEventListener("click", function () { location.hash = tr.getAttribute("data-href"); });
      });
      document.title = (s ? s.name + " — " : "") + "Výsledky testovania";
      return;
    }
    if (parts[0] === "d" && parts[1]) {
      var f = findSetting(parts[1]);
      if (!f) { app.innerHTML = notFound(); return; }
      if (state.settingId !== f.st.id) {
        state.settingId = f.st.id; state.scope = "all"; state.page = 0; state.sortKey = "date"; state.sortDir = -1;
        state.calMonth = calMonths(f.st)[1];
      }
      app.innerHTML = viewDetail(f.strat, f.st);
      document.title = f.st.label + " — Výsledky testovania";
      mountDetail(f.st);
      return;
    }
    app.innerHTML = viewMarkets();
    document.title = "Výsledky testovania";
  }
  function notFound() { return '<div class="msg">Nenašlo sa. <a class="pos" href="#/">Späť na prehľad</a></div>'; }

  function mountDetail(st) {
    var dm = dailyMap(st);
    renderTiles(st);
    renderCalendar(st, dm);
    renderCharts(st, dm);
    renderTrades(st);
    function renderProp() { $("pp-table").innerHTML = propTable(st); $("pp-size").textContent = propSizeText(); renderPropChart(st, $("pp-firm").value); }
    renderProp(); bindPropControls(renderProp);
    renderStreaks(st);
    bindZoom("ch-streaks", function () { return window._streakChart; });
    bindZoom("ch-prop", function () { return window._propChart; });
    $("pp-firm").addEventListener("change", function () { window._propHi = null; renderProp(); });
    $("scope").addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return;
      state.scope = b.getAttribute("data-s"); renderTiles(st);
    });
    $("cal-prev").addEventListener("click", function () { state.calMonth = shiftMonth(state.calMonth, -1); renderCalendar(st, dm); });
    $("cal-next").addEventListener("click", function () { state.calMonth = shiftMonth(state.calMonth, 1); renderCalendar(st, dm); });
    $("pg-prev").addEventListener("click", function () { state.page--; renderTrades(st); });
    $("pg-next").addEventListener("click", function () { state.page++; renderTrades(st); });
    Array.prototype.forEach.call(document.querySelectorAll("th.sort"), function (th) {
      th.addEventListener("click", function () {
        var k = th.getAttribute("data-k");
        if (state.sortKey === k) state.sortDir *= -1; else { state.sortKey = k; state.sortDir = -1; }
        state.page = 0; renderTrades(st);
      });
    });
  }

  // ---------- téma ----------
  function currentTheme() {
    var t = document.documentElement.getAttribute("data-theme");
    if (t) return t;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  }
  $("theme").addEventListener("click", function () {
    var t = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem("dashboard-theme", t); } catch (e) {}
    if (DATA) route();
  });
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: light)");
    var onMq = function () { if (DATA && !document.documentElement.getAttribute("data-theme")) route(); };
    if (mq.addEventListener) mq.addEventListener("change", onMq); else if (mq.addListener) mq.addListener(onMq);
  }

  // ---------- štart ----------
  function start(data) {
    DATA = data || {};
    DATA.strategies = DATA.strategies || [];
    $("updated").textContent = DATA.updated ? "Aktualizované " + DATA.updated : "";
    $("note").textContent = DATA.note || "";
    $("note").title = DATA.note || "";
    window.addEventListener("hashchange", route);
    route();
  }
  if (window.DASHBOARD_DATA) start(window.DASHBOARD_DATA);
  else {
    fetch("dashboard_data.json", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(start)
      .catch(function (e) {
        $("app").innerHTML = '<div class="msg"><h1>Dáta sa nepodarilo načítať</h1><p>Súbor <code>dashboard_data.json</code> musí ležať vedľa tejto stránky. ' +
          "Pri otvorení priamo zo súboru (file://) prehliadač načítanie blokuje — spusti v priečinku <code>python3 -m http.server</code> a otvor " +
          "<code>http://localhost:8000/</code>.</p><p class=\"muted\">" + esc(e && e.message) + "</p></div>";
      });
  }
})();
</script>
</body>
</html>
