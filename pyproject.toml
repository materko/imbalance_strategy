[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "0.1.0"
description = "TradeBot - spolocne jadro strategii pre Freqtrade a MultiCharts"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
# Jadro (tradebot.core) je zamerne bez zavislosti - beha aj v MultiCharts CPythone.
# Nastroje Testera (tester/) uz pandas/plotly potrebuju; pandas sa taha s Freqtrade.
plot = ["plotly>=5", "pandas"]
# Webapp pre testerov (tester.webapp) - fastapi aj uvicorn su uz zavislosti Freqtradu.
web = ["fastapi", "uvicorn", "pandas", "pyarrow"]
# Most do C# jadra strategii (tradebot.adapters.csharp) v procese. Bez neho most spusta
# TradeBot.Host.exe ako samostatny proces (pomalsie, ale bez zavislosti); na macOS/Linuxe treba Mono.
csharp = ["pythonnet>=3.0"]
# Obchodny stroj s NinjaTraderom: preklad bez cloveka = F5 v NinjaScript Editore cez UI automatizaciu
# (tradebot.adapters.ninjatrader nt_compile_via_editor, docs/LIVE.md faza 2c). Inde netreba.
live = ["pywinauto>=0.6.8; sys_platform == 'win32'"]

# Instaluje sa LEN produkt. Balik `tester` je naradie tohto repozitara, spusta sa
# z jeho korena (`python -m tester.webapp`) a zamerne sa nedostane do globalneho
# Pythonu, kde bezi MultiCharts - tam by generic meno "tester" nemalo co robit.
[tool.setuptools.packages.find]
include = ["tradebot*"]

[tool.setuptools.package-data]
tradebot = ["strategies/*/configs/*.json", "strategies/*/docs/sources/*.pine", "core/*.json"]

[tool.ruff]
# Behy, archívy a dáta nie sú kód; worktrees v .claude/ sú kópie repozitára
extend-exclude = ["tester/runs", "tester/archive", "data", ".claude"]

[tool.ruff.lint]
# Chyby (pyflakes + syntax), nie štýl: kontroluje to CI (.github/workflows/lint.yml)
select = ["E4", "E7", "E9", "F"]
# import až po úprave sys.path / kontrole prostredia, `a; b` v krátkych riadkoch, mená l/O
# vo vzorcoch z Pine a lambda priradená do mena sú tu zámerne
ignore = ["E402", "E702", "E741", "E731"]

[tool.ruff.lint.per-file-ignores]
# Signály MultiCharts: `from PowerLanguage import *` je predpísaný vzor študie
"deploy/multicharts/*.py" = ["F403", "F405"]

[tool.pytest.ini_options]
# tradebot/tests = produkt, tester/tests = nastroje Testera a porovnavacie (golden) testy
testpaths = ["tradebot/tests", "tester/tests"]
