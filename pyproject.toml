[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibs"
version = "0.1.0"
description = "IBS Imbalance Breakout Strategy - spolocne jadro pre Freqtrade a MultiCharts"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ibs*"]

[tool.setuptools.package-data]
ibs = ["configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["ibs/tests"]
