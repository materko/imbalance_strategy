# Spúšťaj z koreňa repozitára:
#   docker compose -f docker/docker-compose.yml <prikaz>
#
# Sluzby:
#   tests      jednorazovo: pytest nad jadrom (aj parita s Pine suborom)
#   download   jednorazovo: stiahnutie oficialnych TF z burz
#   backtest   jednorazovo: backtest s 1m detailom
#   freqtrade  dlhobeziaci bot - toto sa nasadzuje na server
#   webapp     webova aplikacia pre testerov (docs/WEBAPP.md), port 8765
#
# Vsetko okrem `freqtrade` je pod profilom, aby `docker compose up` samo o sebe
# spustilo len bota a nie aj jednorazove ulohy.

name: tradebot

x-freqtrade-base: &freqtrade-base
  build:
    context: ..
    dockerfile: docker/Dockerfile.freqtrade
  image: tradebot-freqtrade:latest
  volumes:
    # userdir Freqtradu (strategie, hyperopty, vysledky) je zapisovatelny
    - ../deploy/freqtrade/user_data:/freqtrade/user_data
    - ../deploy/freqtrade:/freqtrade/cfg:ro
    # sviecky su spolocne pre oba enginy: data/<zdroj>/ - dava sa cez --datadir
    - ../data:/app/data
    # zdrojaky jadra read-only, aby sa zmeny prejavili bez rebuildu
    - ../tradebot:/app/tradebot:ro
  environment:
    TZ: ${TZ:-Europe/Bratislava}
  env_file:
    - path: ../.env
      required: false

services:
  tests:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
    image: tradebot-core:latest
    volumes:
      - ../tradebot:/app/tradebot:ro

  download:
    <<: *freqtrade-base
    profiles: ["tools"]
    command: >
      download-data
      --config /freqtrade/cfg/config.binance.json
      --userdir /freqtrade/user_data
      --datadir /app/data/binance
      --timeframes 1m 3m 5m
      --days ${DAYS:-60}

  download-coinbase:
    <<: *freqtrade-base
    profiles: ["tools"]
    # Coinbase neponuka 3m - stahuju sa len oficialne TF.
    command: >
      download-data
      --config /freqtrade/cfg/config.coinbase.json
      --userdir /freqtrade/user_data
      --datadir /app/data/coinbase
      --timeframes 1m 5m
      --days ${DAYS:-60}

  backtest:
    <<: *freqtrade-base
    profiles: ["tools"]
    command: >
      backtesting
      --config /freqtrade/cfg/config.binance.json
      --userdir /freqtrade/user_data
      --datadir /app/data/binance
      --strategy ${STRATEGY:-IBSImbalanceStrategy}
      --timeframe-detail 1m

  webapp:
    # Webova aplikacia pre testerov (docs/WEBAPP.md). Bezi s PYTHONPATH=/app, takze
    # korenom repozitara je pre nu /app - vsetko, co cita alebo zapisuje, musi byt
    # namountovane pod /app (tradebot/core/paths.py). Historia behov a profily testera
    # su zapisovatelne, zdrojaky a Pine read-only.
    # Git synchronizacia z UI v kontajneri nefunguje (nie je tam .git ani git) -
    # pushuj/pulluj behy z hostitela, alebo spustaj webapp nativne.
    <<: *freqtrade-base
    profiles: ["tools"]
    container_name: tradebot-webapp
    entrypoint: ["python", "-m", "tester.webapp"]
    command: []
    volumes:
      - ../tester:/app/tester
      - ../data:/app/data
      - ../deploy/freqtrade/user_data:/app/deploy/freqtrade/user_data
      - ../deploy/freqtrade:/freqtrade/cfg:ro
      - ../tradebot:/app/tradebot:ro
      - ../docs:/app/docs:ro
    environment:
      TZ: ${TZ:-Europe/Bratislava}
      TRADEBOT_WEB_HOST: 0.0.0.0
      TRADEBOT_WEB_PORT: "8765"
      PYTHONPATH: /app
    ports:
      - "127.0.0.1:8765:8765"

  freqtrade:
    <<: *freqtrade-base
    container_name: tradebot-freqtrade
    restart: unless-stopped
    ports:
      # FreqUI / REST API. Naviazane na localhost - na server daj pred to reverse proxy.
      - "127.0.0.1:8080:8080"
    command: >
      trade
      --config /freqtrade/cfg/config.binance.json
      --userdir /freqtrade/user_data
      --datadir /app/data/binance
      --strategy ${STRATEGY:-IBSImbalanceStrategy}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
